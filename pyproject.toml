[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokedev-platform"
version = "0.1.0"
description = "PokeDev software development control plane"
requires-python = ">=3.12,<3.15"
dynamic = ["dependencies"]

[project.scripts]
pokedev = "langflow.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["deploy/local/requirements.in"]}

[tool.setuptools.packages.find]
where = ["adlc-flow"]
include = ["langflow*", "lfx*"]
exclude = ["lfx.src*", "lfx.tests*", "langflow.tests*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.md", "**/*.txt", "**/*.mako", "**/*.ini"]
